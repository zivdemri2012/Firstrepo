<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Bookmark Manager</span>
        </div>
        <button class="btn btn-primary" id="addBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Bookmark
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search bookmarks…">
        <button class="search-clear" id="searchClear" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="tags-bar" id="tagsBar"></div>
    </div>

    <main class="main">
      <div class="results-bar">
        <span id="resultCount" class="result-count"></span>
        <button class="clear-filter-btn" id="clearFilterBtn" style="display:none">
          Clear filter
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="grid" id="bookmarksGrid"></div>

      <div class="empty-state" id="emptyState" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <p id="emptyMessage">No bookmarks yet. Add your first one!</p>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Bookmark</h2>
        <button class="modal-close" id="modalClose">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="bookmarkForm" novalidate>
        <input type="hidden" id="editId">
        <div class="form-group">
          <label for="urlInput">URL <span class="required">*</span></label>
          <input type="url" id="urlInput" placeholder="https://example.com" autocomplete="off">
          <span class="field-error" id="urlError"></span>
        </div>
        <div class="form-group">
          <label for="titleInput">Title <span class="required">*</span></label>
          <input type="text" id="titleInput" placeholder="Page title" autocomplete="off">
          <span class="field-error" id="titleError"></span>
        </div>
        <div class="form-group">
          <label for="descInput">Description</label>
          <textarea id="descInput" placeholder="Brief description…" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="tagsInput">Tags</label>
          <input type="text" id="tagsInput" placeholder="tech, tools, reading">
          <span class="field-hint">Comma-separated</span>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Bookmark</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirm -->
  <div class="overlay" id="deleteOverlay" style="display:none">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Bookmark</h2>
      </div>
      <p class="confirm-text">Are you sure you want to delete <strong id="deleteTitle"></strong>? This cannot be undone.</p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
