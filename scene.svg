<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b22"/>
      <stop offset=".6" stop-color="#1c2252"/>
      <stop offset="1" stop-color="#4a3b6e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d3c"/>
      <stop offset="1" stop-color="#1b1b25"/>
    </linearGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="6" height="8" fill="#ffd27a" opacity=".7"/>
    </pattern>
    <pattern id="win2" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="6" height="8" fill="#a9bcff" opacity=".35"/>
    </pattern>
    <pattern id="curb" width="40" height="8" patternUnits="userSpaceOnUse">
      <rect width="20" height="8" fill="#2457c5"/>
      <rect x="20" width="20" height="8" fill="#ececf2"/>
    </pattern>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1000" height="560" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.2"/><circle cx="210" cy="28" r="1"/><circle cx="260" cy="90" r="1.4"/>
    <circle cx="330" cy="50" r="1"/><circle cx="460" cy="30" r="1.3"/><circle cx="520" cy="80" r="1"/>
    <circle cx="610" cy="45" r="1.2"/><circle cx="700" cy="20" r="1"/><circle cx="760" cy="70" r="1.5"/>
    <circle cx="850" cy="35" r="1"/><circle cx="930" cy="60" r="1.2"/><circle cx="975" cy="25" r="1"/>
  </g>
  <circle cx="140" cy="75" r="24" fill="#f3eed8"/>
  <circle cx="152" cy="68" r="22" fill="#0e1430"/>

  <!-- far skyline -->
  <g>
    <rect x="290" y="190" width="62" height="235" fill="#141938"/>
    <rect x="290" y="190" width="62" height="235" fill="url(#win)"/>
    <rect x="368" y="120" width="72" height="305" fill="#171c3e"/>
    <ellipse cx="404" cy="120" rx="36" ry="8" fill="#1f2550"/>
    <rect x="368" y="125" width="72" height="300" fill="url(#win)"/>
    <polygon points="455,425 455,150 520,132 520,425" fill="#141938"/>
    <polygon points="455,425 455,150 520,132 520,425" fill="url(#win2)"/>
    <rect x="536" y="165" width="64" height="260" fill="#171c3e"/>
    <rect x="536" y="165" width="64" height="260" fill="url(#win)"/>
    <rect x="612" y="250" width="160" height="175" fill="#1b2046"/>
    <rect x="612" y="250" width="160" height="175" fill="url(#win2)"/>
    <circle cx="404" cy="104" r="3" fill="#ff4b4b"/>
  </g>
  <!-- projection on the wide building -->
  <text x="692" y="300" text-anchor="middle" direction="rtl" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#8fd3ff" filter="url(#glow)">דמוקרטיה</text>
  <g transform="translate(692 330)" filter="url(#glow)" fill="none" stroke="#8fd3ff" stroke-width="2.5">
    <polygon points="0,-14 12,7 -12,7"/>
    <polygon points="0,14 12,-7 -12,-7"/>
  </g>

  <!-- left Bauhaus building -->
  <g>
    <path d="M0 225 H215 Q255 225 255 265 V425 H0 Z" fill="#b9b2cc"/>
    <g fill="#2a2d4a">
      <rect x="18" y="240" width="215" height="18" rx="2"/>
      <rect x="18" y="295" width="225" height="18" rx="2"/>
      <rect x="18" y="350" width="225" height="18" rx="2"/>
    </g>
    <g fill="#ffd27a" opacity=".85">
      <rect x="40" y="243" width="26" height="12"/><rect x="150" y="243" width="26" height="12"/>
      <rect x="95" y="298" width="26" height="12"/><rect x="200" y="298" width="26" height="12"/>
      <rect x="40" y="353" width="26" height="12"/>
    </g>
    <g fill="#d8d2e6">
      <rect x="10" y="262" width="240" height="14" rx="7"/>
      <rect x="10" y="317" width="240" height="14" rx="7"/>
      <rect x="10" y="372" width="240" height="14" rx="7"/>
    </g>
    <!-- flag hanging from a balcony -->
    <g transform="translate(150 331)">
      <rect width="44" height="30" fill="#f7f7fb"/>
      <rect y="3" width="44" height="4" fill="#2457c5"/>
      <rect y="23" width="44" height="4" fill="#2457c5"/>
      <polygon points="22,9 27,18 17,18" fill="none" stroke="#2457c5" stroke-width="1.5"/>
      <polygon points="22,21 27,12 17,12" fill="none" stroke="#2457c5" stroke-width="1.5"/>
    </g>
    <rect x="0" y="392" width="255" height="33" fill="#8f88a6"/>
    <rect x="30" y="398" width="60" height="27" fill="#ffcf73" opacity=".8"/>
    <rect x="120" y="398" width="100" height="27" fill="#2a2d4a"/>
  </g>

  <!-- right Bauhaus building -->
  <g>
    <path d="M1000 235 H840 Q795 235 795 280 V425 H1000 Z" fill="#b5aecb"/>
    <g fill="#2a2d4a">
      <rect x="812" y="292" width="188" height="18"/>
      <rect x="812" y="345" width="188" height="18"/>
      <rect x="830" y="248" width="170" height="18"/>
    </g>
    <g fill="#ffd27a" opacity=".85">
      <rect x="860" y="295" width="24" height="12"/><rect x="940" y="348" width="24" height="12"/>
      <rect x="900" y="251" width="24" height="12"/>
    </g>
    <g fill="#d6d0e6">
      <rect x="800" y="313" width="200" height="12" rx="6"/>
      <rect x="800" y="366" width="200" height="12" rx="6"/>
      <rect x="815" y="269" width="185" height="12" rx="6"/>
    </g>
    <rect x="795" y="392" width="205" height="33" fill="#8d86a4"/>
    <rect x="900" y="398" width="80" height="27" fill="#ffcf73" opacity=".7"/>
    <text x="940" y="416" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5a3a12">קיוסק</text>
  </g>

  <!-- palm trees -->
  <g fill="none" stroke-linecap="round">
    <path d="M272 425 Q268 360 284 300" stroke="#3b2e2a" stroke-width="7"/>
    <g stroke="#1f4a33" stroke-width="5">
      <path d="M284 300 Q260 285 238 300"/><path d="M284 300 Q262 270 245 268"/>
      <path d="M284 300 Q290 268 312 262"/><path d="M284 300 Q312 284 330 300"/>
      <path d="M284 300 Q282 280 280 262"/><path d="M284 300 Q300 300 312 318"/>
    </g>
    <path d="M770 425 Q776 365 762 310" stroke="#3b2e2a" stroke-width="7"/>
    <g stroke="#1f4a33" stroke-width="5">
      <path d="M762 310 Q738 296 718 312"/><path d="M762 310 Q742 280 726 278"/>
      <path d="M762 310 Q770 278 792 272"/><path d="M762 310 Q790 294 806 312"/>
      <path d="M762 310 Q760 290 758 272"/>
    </g>
  </g>

  <!-- road -->
  <rect y="420" width="1000" height="140" fill="url(#road)"/>
  <rect y="420" width="1000" height="8" fill="url(#curb)"/>
  <line x1="0" y1="505" x2="1000" y2="505" stroke="#d8d2b0" stroke-width="3" stroke-dasharray="34 26" opacity=".35"/>
  <g fill="#f2f2f6" opacity=".4">
    <rect x="852" y="432" width="11" height="128"/><rect x="874" y="432" width="11" height="128"/>
    <rect x="896" y="432" width="11" height="128"/><rect x="918" y="432" width="11" height="128"/>
    <rect x="940" y="432" width="11" height="128"/>
  </g>

  <!-- street lamps -->
  <g>
    <circle cx="200" cy="232" r="55" fill="url(#lampGlow)"/>
    <rect x="197" y="236" width="5" height="190" fill="#3a3d4f"/>
    <path d="M199 240 Q199 226 212 226" stroke="#3a3d4f" stroke-width="4" fill="none"/>
    <circle cx="212" cy="230" r="5" fill="#fff4cc"/>
    <circle cx="560" cy="232" r="55" fill="url(#lampGlow)"/>
    <rect x="557" y="236" width="5" height="190" fill="#3a3d4f"/>
    <path d="M559 240 Q559 226 572 226" stroke="#3a3d4f" stroke-width="4" fill="none"/>
    <circle cx="572" cy="230" r="5" fill="#fff4cc"/>
  </g>
</svg>
